name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Structure and Build APK
        run: |
          # التأكد من وجود مجلد lib والملف بداخله
          mkdir -p lib
          if [ -f "main.dart" ]; then mv main.dart lib/; fi
          
          # إنشاء مشروع أندرويد متكامل
          flutter create . --platforms=android --project-name=game_scoreboard
          
          flutter pub get
          
          # بناء APK جاهز للتثبيت بدون تعقيدات التوقيع
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
