name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Complete Android Project & Build
        run: |
          mkdir -p /tmp/my_code
          cp -r . /tmp/my_code/
          rm -rf *
          rm -rf .git*
          flutter create . --platforms=android --project-name=game_scoreboard
          cp -f /tmp/my_code/pubspec.yaml .
          mkdir -p lib
          if [ -f "/tmp/my_code/lib/main.dart" ]; then
            cp -f /tmp/my_code/lib/main.dart lib/
          elif [ -f "/tmp/my_code/main.dart" ]; then
            cp -f /tmp/my_code/main.dart lib/
          fi
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
